version: '3.8'

services:
  backend:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_SSL=${DATABASE_SSL}
    command: npm run dev
    env_file:
      - ./.env
    depends_on:
      - db
  db:
    image: postgres:latest
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: tsuuwa
      POSTGRES_PASSWORD: tsuuwa123
      POSTGRES_DB: tsuuwa
    volumes:
      - db_store:/var/lib/postgresql/data

volumes:
  db_store: